<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f2e8" />
    <meta name="description" content="古文乐园：适合小小读书人的古文阅读乐园。" />
    <title>古文乐园 · 小小读书人</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="dictation.css" />
  </head>
  <body>
    <div class="page-decoration page-decoration--one" aria-hidden="true"></div>
    <div class="page-decoration page-decoration--two" aria-hidden="true"></div>
    <div class="app-shell">
      <div id="app" aria-live="polite">
        <div class="loading-state"><span class="loading-mark" aria-hidden="true">墨</span><p>正在打开古文小书架……</p></div>
      </div>
      <footer class="footer"><span>把古人的好句子，读给今天的自己。</span><span class="footer-seal" aria-hidden="true">乐</span></footer>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="character-modal" class="modal-backdrop is-hidden" role="presentation">
      <section class="character-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-hint">
        <button class="modal-close" id="modal-close" type="button" aria-label="关闭汉字练习">×</button>
        <div class="modal-header">
          <span class="modal-eyebrow">汉字小课堂</span>
          <h2 id="modal-title"><span id="modal-character">字</span></h2>
          <p id="modal-hint">先看笔顺，再在田字格里试一试</p>
          <p class="modal-detail"><span id="modal-pinyin">zì</span><span class="modal-detail-divider" aria-hidden="true">·</span><span id="modal-meaning">汉字小伙伴</span></p>
        </div>
        <div class="writer-stage" id="writer-stage">
          <div class="writer-grid" aria-hidden="true"></div>
          <div id="writer-target" class="writer-target" aria-label="汉字书写练习区"></div>
          <div id="writer-fallback" class="writer-fallback is-hidden" aria-live="polite"><span id="fallback-character">字</span><small>笔顺动画加载中，先观察这个字的结构吧</small></div>
        </div>
        <p class="writer-status" id="writer-status" aria-live="polite">点击“演示笔顺”，再开始描写。</p>
        <div class="modal-actions"><button class="button button--soft" id="animate-button" type="button"><span aria-hidden="true">◌</span> 演示笔顺</button><button class="button button--soft" id="speak-character" type="button"><span aria-hidden="true">🔊</span> 听读音</button><button class="button button--primary" id="practice-button" type="button"><span aria-hidden="true">✎</span> 开始书写 / 我来试一试</button></div>
        <button class="modal-done" id="modal-done" type="button">我写好了，继续探索 <span aria-hidden="true">→</span></button>
      </section>
    </div>
    <div id="celebration" class="celebration" aria-hidden="true"><span>✦</span><span>✧</span><span>·</span><span>✦</span><span>✧</span></div>
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@2.0.2/dist/hanzi-writer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.18.2/dist/index.js"></script>
    <script src="dictation.js"></script>
    <script src="app.js"></script>
  </body>
</html>
